---
- name: Initialize Vault Secrets
  hosts: hangar
  become: false

  vars:
    hangar_dir: "{{ ansible_env.HOME }}/documents/hangar"

  tasks:
    # ── Load root token ──────────────────────────────────────────────────────

    - name: Read Vault init data
      become: true
      slurp:
        src: /etc/vault.d/keys/init.json
      register: vault_init_raw

    - name: Set root token fact
      set_fact:
        vault_root_token: "{{ (vault_init_raw.content | b64decode | from_json).root_token }}"
      no_log: true

    # ── Wait for Vault to be unsealed ────────────────────────────────────────

    - name: Wait for Vault to be unsealed
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          vault status -format=json | jq -e '.sealed == false' > /dev/null
      register: vault_unsealed
      retries: 10
      delay: 5
      until: vault_unsealed.rc == 0
      changed_when: false

    # ── KV secrets engine ────────────────────────────────────────────────────

    - name: Check if KV secrets engine is already enabled
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault secrets list -format=json | jq -e '."hangar/"' > /dev/null 2>&1 \
          && echo "ok" || echo "missing"
      register: kv_check
      changed_when: false
      no_log: true

    - name: Enable KV v2 secrets engine at hangar/
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault secrets enable -path=hangar kv-v2
      when: kv_check.stdout == "missing"
      no_log: true

    # ── Nomad ACL policies and tokens ────────────────────────────────────────

    - name: Create Nomad deploy ACL policy
      become: true
      shell: |
        NOMAD_TOKEN=$(cat /etc/nomad.d/bootstrap.json | jq -r '.SecretID') \
        nomad acl policy apply -description "Deploy pipeline access" deploy - <<'EOF'
        namespace "default" {
          policy = "read"
          capabilities = [
            "submit-job",
            "read-job",
            "read-logs",
            "read-fs",
            "alloc-exec",
            "alloc-lifecycle",
          ]
        }
        node {
          policy = "read"
        }
        EOF
      changed_when: false

    - name: Check if deploy token exists
      stat:
        path: /etc/nomad.d/deploy.json
      register: deploy_token_check

    - name: Create Nomad deploy ACL token
      become: true
      shell: |
        NOMAD_TOKEN=$(cat /etc/nomad.d/bootstrap.json | jq -r '.SecretID') \
        nomad acl token create -name "deploy" -policy deploy -ttl 0 -json
      register: deploy_token_raw
      when: not deploy_token_check.stat.exists
      no_log: true

    - name: Save deploy token to disk
      become: true
      copy:
        content: "{{ deploy_token_raw.stdout }}"
        dest: /etc/nomad.d/deploy.json
        mode: "0600"
        owner: root
        group: root
      when: not deploy_token_check.stat.exists

    - name: Create Nomad operator ACL policy
      become: true
      shell: |
        NOMAD_TOKEN=$(cat /etc/nomad.d/bootstrap.json | jq -r '.SecretID') \
        nomad acl policy apply -description "Full operator access" operator - <<'EOF'
        namespace "default" {
          policy = "write"
        }
        agent {
          policy = "write"
        }
        operator {
          policy = "write"
        }
        node {
          policy = "write"
        }
        host_volume "*" {
          policy = "write"
        }
        EOF
      changed_when: false

    - name: Check if operator token exists
      stat:
        path: /etc/nomad.d/operator.json
      register: operator_token_check

    - name: Create Nomad operator ACL token
      become: true
      shell: |
        NOMAD_TOKEN=$(cat /etc/nomad.d/bootstrap.json | jq -r '.SecretID') \
        nomad acl token create -name "operator" -policy operator -ttl 0 -json
      register: operator_token_raw
      when: not operator_token_check.stat.exists
      no_log: true

    - name: Save operator token to disk
      become: true
      copy:
        content: "{{ operator_token_raw.stdout }}"
        dest: /etc/nomad.d/operator.json
        mode: "0600"
        owner: root
        group: root
      when: not operator_token_check.stat.exists

    - name: Load Nomad deploy token
      become: true
      shell: cat /etc/nomad.d/deploy.json | jq -r '.SecretID'
      register: nomad_token
      changed_when: false
      no_log: true

    # ── Seed hangar/config ───────────────────────────────────────────────────

    - name: Seed hangar/config secret
      shell: |
        set -e
        export VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true VAULT_TOKEN={{ vault_root_token }}
        existing=$(vault kv get -format=json hangar/config 2>/dev/null || echo '{}')
        keep() { echo "$existing" | jq -r --arg k "$1" '.data.data[$k] // empty'; }
        admin_token=$(keep admin_token)
        postgres_password=$(keep postgres_password)
        redis_password=$(keep redis_password)
        fresh() { current=$(keep "$1"); if [ -n "$current" ]; then echo "$current"; else openssl rand -hex "$2"; fi; }
        registry_password=$(keep registry_password)
        registry_htpasswd=$(keep registry_htpasswd)
        if [ -z "$registry_password" ] || [ -z "$registry_htpasswd" ]; then
          registry_password=${registry_password:-$(openssl rand -hex 24)}
          registry_htpasswd=$(printf '%s' "$registry_password" | htpasswd -niB hangar)
        fi
        vault kv put hangar/config \
          nomad_addr="{{ nomad_addr }}" \
          consul_addr="{{ consul_addr }}" \
          nomad_token="{{ nomad_token.stdout }}" \
          admin_token="${admin_token:-$(openssl rand -hex 32)}" \
          postgres_password="${postgres_password:-$(openssl rand -hex 24)}" \
          redis_password="${redis_password:-$(openssl rand -hex 24)}" \
          registry_user="hangar" \
          registry_password="$registry_password" \
          registry_htpasswd="$registry_htpasswd" \
          s3_admin_access_key="$(fresh s3_admin_access_key 10)" \
          s3_admin_secret_key="$(fresh s3_admin_secret_key 24)" \
          walg_access_key="$(fresh walg_access_key 10)" \
          walg_secret_key="$(fresh walg_secret_key 24)"
      changed_when: false
      no_log: true

    - name: Read registry password
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault kv get -field=registry_password hangar/config
      register: registry_password
      changed_when: false
      no_log: true

    - name: Create root Docker config directory
      become: true
      file:
        path: /root/.docker
        state: directory
        mode: "0700"

    - name: Give Podman the registry credentials
      become: true
      copy:
        dest: /root/.docker/config.json
        content: '{"auths":{"registry.service.consul:5000":{"auth":"{{ ("hangar:" ~ registry_password.stdout) | b64encode }}"}}}'
        mode: "0600"
      no_log: true

    # ── Nomad workload identity JWT auth ─────────────────────────────────────

    - name: Check if JWT auth is already enabled
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault auth list -format=json | jq -e '."jwt-nomad/"' > /dev/null 2>&1 \
          && echo "ok" || echo "missing"
      register: jwt_auth_check
      changed_when: false
      no_log: true

    - name: Enable Vault JWT auth at jwt-nomad
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault auth enable -path=jwt-nomad jwt
      when: jwt_auth_check.stdout == "missing"
      no_log: true

    - name: Configure Nomad JWT auth method
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault write auth/jwt-nomad/config \
            jwks_url="http://127.0.0.1:4646/.well-known/jwks.json" \
            jwt_supported_algs="RS256,EdDSA" \
            default_role="nomad-workloads"
      changed_when: false
      no_log: true

    - name: Create Vault policy for Nomad workloads
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault policy write nomad-workloads - <<'EOF'
        path "hangar/data/*" {
          capabilities = ["read"]
        }
        path "hangar/data/jobs/*" {
          capabilities = ["create", "update", "read", "delete"]
        }
        path "hangar/data/databases/*" {
          capabilities = ["create", "update", "read", "delete"]
        }
        path "hangar/metadata/databases/*" {
          capabilities = ["read", "list", "delete"]
        }
        EOF
      changed_when: false
      no_log: true

    - name: Read the Nomad JWT mount accessor
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault auth list -format=json | jq -r '."jwt-nomad/".accessor'
      register: jwt_accessor
      changed_when: false
      no_log: true

    - name: Create Vault policy for user apps
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault policy write nomad-apps - <<'EOF'
        path "hangar/data/jobs/{{ '{{' }}identity.entity.aliases.{{ jwt_accessor.stdout }}.metadata.nomad_job_id{{ '}}' }}/*" {
          capabilities = ["read"]
        }
        EOF
      changed_when: false
      no_log: true

    - name: Create Nomad JWT auth role
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault write auth/jwt-nomad/role/nomad-workloads \
            role_type="jwt" \
            bound_audiences="vault.io" \
            user_claim="/nomad_job_id" \
            user_claim_json_pointer=true \
            claim_mappings="/nomad_job_id=nomad_job_id" \
            claim_mappings="/nomad_task=nomad_task" \
            token_policies="nomad-workloads" \
            token_period="1h" \
            token_type="service"
      changed_when: false
      no_log: true

    - name: Create Nomad JWT auth role for user apps
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault write auth/jwt-nomad/role/nomad-apps - <<'EOF'
        {
          "role_type": "jwt",
          "bound_audiences": "vault.io",
          "bound_claims_type": "glob",
          "bound_claims": {"nomad_job_id": "hangar-dep-*"},
          "user_claim": "/nomad_job_id",
          "user_claim_json_pointer": true,
          "claim_mappings": {"/nomad_job_id": "nomad_job_id", "/nomad_task": "nomad_task"},
          "token_policies": "nomad-apps",
          "token_period": "1h",
          "token_type": "service"
        }
        EOF
      changed_when: false
      no_log: true

    - name: Create Vault policy for database jobs
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault policy write nomad-databases - <<'EOF'
        path "hangar/data/databases/{{ '{{' }}identity.entity.aliases.{{ jwt_accessor.stdout }}.metadata.nomad_job_id{{ '}}' }}/*" {
          capabilities = ["read"]
        }
        EOF
      changed_when: false
      no_log: true

    - name: Create Nomad JWT auth role for database jobs
      shell: |
        VAULT_ADDR=https://127.0.0.1:8200 VAULT_SKIP_VERIFY=true \
          VAULT_TOKEN={{ vault_root_token }} \
          vault write auth/jwt-nomad/role/nomad-databases - <<'EOF'
        {
          "role_type": "jwt",
          "bound_audiences": "vault.io",
          "bound_claims_type": "glob",
          "bound_claims": {"nomad_job_id": "hangar-db-*"},
          "user_claim": "/nomad_job_id",
          "user_claim_json_pointer": true,
          "claim_mappings": {"/nomad_job_id": "nomad_job_id", "/nomad_task": "nomad_task"},
          "token_policies": "nomad-databases",
          "token_period": "1h",
          "token_type": "service"
        }
        EOF
      changed_when: false
      no_log: true

    # ── Done ─────────────────────────────────────────────────────────────────

    - name: Confirm vault-init complete
      debug:
        msg:
          - "✅ KV engine enabled at hangar/"
          - "✅ Nomad deploy + operator ACL policies and tokens created"
          - "✅ hangar/config seeded with deploy token"
          - "✅ JWT auth configured at jwt-nomad"
          - "✅ nomad-workloads policy + role created"
          - "✅ nomad-apps policy + role created (user apps read only their own env)"
          - "✅ nomad-databases policy + role created (database jobs read only their own credentials)"
          - "✅ Vault ready for Nomad workload identity"
